name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run jar -- --seed 7 --days 10 --out out/ci
      - uses: actions/upload-artifact@v4
        with:
          name: contact-sheet-${{ matrix.os }}
          path: out/ci/contact-sheet.png
          if-no-files-found: error
